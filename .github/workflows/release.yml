name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (exe)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: |
          $targets = @(
            "C:\Android",
            "C:\Program Files\Android",
            "$env:LOCALAPPDATA\Android",
            "$env:USERPROFILE\AppData\Local\Android",
            "C:\Miniconda",
            "C:\ProgramData\Miniconda",
            "C:\ghcup",
            "C:\Program Files\Julia",
            "C:\Program Files\R",
            "C:\Program Files\MongoDB",
            "$env:USERPROFILE\.nuget\packages"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) { Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-binaries-windows-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-windows-x64-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          archives: qtbase qtsvg qttools
          cache: true

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install --triplet x64-windows --x-manifest-root="$PWD" "--x-install-root=$env:VCPKG_INSTALLATION_ROOT\installed"
          # 清理源码树释放磁盘，供后续 CMake 构建使用
          Remove-Item -Recurse -Force "$env:VCPKG_INSTALLATION_ROOT\buildtrees" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Configure, build, test and package
        shell: cmd
        run: |
          rem 定位 VS2025（runner 镜像已不含 VS2022）
          set "VCVARS=C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if exist "%VCVARS%" goto havevs
          for /f "delims=" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath') do set "VCVARS=%%i\VC\Auxiliary\Build\vcvarsall.bat"
          :havevs
          echo Using %VCVARS%
          call "%VCVARS%" amd64 || exit /b 1

          echo === Configure ===
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" || exit /b 1

          echo === Build ===
          cmake --build build --parallel || exit /b 1

          echo === Tests ===
          set QT_QPA_PLATFORM=offscreen
          ctest --test-dir build --output-on-failure || exit /b 1

          echo === Package ===
          mkdir package
          windeployqt --release --no-translations --compiler-runtime build\xareviewer.exe --dir package || exit /b 1
          rem vcpkg 动态依赖（OpenCV/DCMTK/ITK 等 DLL）windeployqt 不会部署，需手动复制
          copy "%VCPKG_INSTALLATION_ROOT%\installed\x64-windows\bin\*.dll" package\ >nul || exit /b 1
          copy build\xareviewer.exe package\ >nul
          if exist build\core_smoke.exe copy build\core_smoke.exe package\ >nul
          if exist build\ui_smoke.exe copy build\ui_smoke.exe package\ >nul
          rem 校验关键 DLL 已进入包内
          dir package\opencv_core*.dll package\dcmdata*.dll || exit /b 1
          powershell -Command "Compress-Archive -Path package\* -DestinationPath XAReviewer-Windows-x64.zip" || exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAReviewer-Windows-x64
          path: XAReviewer-Windows-x64.zip

  build-macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install qt dcmtk opencv itk create-dmg

      - name: Configure (CMake)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix opencv);$(brew --prefix dcmtk);$(brew --prefix itk)"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Create DMG
        run: |
          set -euxo pipefail
          # 只部署依赖，不用 macdeployqt 的 -dmg（其生成的镜像在部分 macOS 上无法挂载）
          macdeployqt build/xareviewer.app -always-overwrite -verbose=1 || true
          # macdeployqt 改写二进制后 arm64 签名失效，重新做 ad-hoc 签名避免“已损坏”提示
          codesign --force --deep --sign - build/xareviewer.app
          codesign --verify --deep build/xareviewer.app
          # 组装拖拽安装布局，用 hdiutil 生成标准 UDZO/HFS+ 镜像
          rm -rf dmg-staging && mkdir -p dmg-staging
          cp -R build/xareviewer.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "XAReviewer" \
            -srcfolder dmg-staging \
            -ov -format UDZO -fs "HFS+J" \
            XAReviewer-macOS.dmg
          # CI 内直接校验镜像可挂载，杜绝坏镜像发布
          hdiutil verify XAReviewer-macOS.dmg
          hdiutil imageinfo XAReviewer-macOS.dmg | grep -E "Format:|Filesystem Name:"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAReviewer-macOS
          path: XAReviewer-macOS.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      # 仓库启用了“不可变发布”规则：已发布 Release 不能追加资产，
      # 因此先以 draft 创建、上传全部资产后再发布。
      - name: Create draft release and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          WIN=dist/XAReviewer-Windows-x64/XAReviewer-Windows-x64.zip
          MAC=dist/XAReviewer-macOS/XAReviewer-macOS.dmg
          {
            echo "Cross-platform release built by CI."
            echo ""
            echo "- Windows x64: \`XAReviewer-Windows-x64.zip\`（解压后运行 xareviewer.exe）"
            echo "- macOS (Apple Silicon): \`XAReviewer-macOS.dmg\`"
            echo ""
            echo "## macOS 首次打开"
            echo "App 为 ad-hoc 签名，首次打开若提示无法验证开发者：右键 App → 打开 → 再点\"打开\"；"
            echo "或执行 \`xattr -cr /Applications/xareviewer.app\` 后双击打开。"
            echo ""
            echo "## SHA256"
            echo '```'
            sha256sum "$WIN" "$MAC"
            echo '```'
          } > NOTES.md
          gh release create "$TAG" "$WIN" "$MAC" \
            --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "XAReviewer $TAG" \
            --notes-file NOTES.md
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
